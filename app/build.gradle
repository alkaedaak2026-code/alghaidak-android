plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alghaidak.huroofi'
    compileSdk 36

    defaultConfig {
        applicationId 'com.alghaidak.huroofi'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '0.1-test'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
