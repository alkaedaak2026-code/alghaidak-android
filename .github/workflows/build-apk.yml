name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore and verify full app HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets dist
          cat app/src/main/assets_pack2/part01.txt \
              app/src/main/assets_pack2/part02.txt \
              app/src/main/assets_pack2/part03.txt \
              app/src/main/assets_pack2/part04.txt \
              app/src/main/assets_pack2/part05.txt \
              app/src/main/assets_pack2/part06.txt \
              app/src/main/assets_pack2/part07.txt \
              app/src/main/assets_pack2/part08.txt | tr -cd 'A-Za-z0-9+/=' > /tmp/index.html.gz.b64
          b64_size=$(wc -c < /tmp/index.html.gz.b64)
          b64_sha=$(sha256sum /tmp/index.html.gz.b64 | awk '{print $1}')
          echo "Base64 size: $b64_size bytes"
          echo "Base64 sha256: $b64_sha"
          test "$b64_size" -eq 52308
          test "$b64_sha" = "8c58f1adc7ca51e4be8d6b98b329c600b954b82586b39c8ff4d26ab0b6685a5d"
          base64 -d /tmp/index.html.gz.b64 > /tmp/index.html.gz
          gunzip -c /tmp/index.html.gz > app/src/main/assets/index.html
          size=$(wc -c < app/src/main/assets/index.html)
          sha=$(sha256sum app/src/main/assets/index.html | awk '{print $1}')
          echo "HTML size: $size bytes"
          echo "HTML sha256: $sha"
          test "$size" -eq 154760
          test "$sha" = "d17eb13033984cb5016ba76e37072b41632ed979a3f13469170f6e7a329881ea"
          grep -q "V3.8.40" app/src/main/assets/index.html
          grep -q "</html>" app/src/main/assets/index.html
          grep -q "<script" app/src/main/assets/index.html

      - name: Build debug APK and save diagnostics
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug 2>&1 | tee dist/build.log
          status=${PIPESTATUS[0]}
          echo "$status" > dist/build-status.txt
          if [ "$status" -eq 0 ] && [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/alghaidak-huroofi-test.apk
          fi
          exit 0

      - name: Verify APK contains full HTML
        if: hashFiles('dist/alghaidak-huroofi-test.apk') != ''
        shell: bash
        run: |
          unzip -p dist/alghaidak-huroofi-test.apk assets/index.html > /tmp/apk-index.html
          apk_size=$(wc -c < /tmp/apk-index.html)
          apk_sha=$(sha256sum /tmp/apk-index.html | awk '{print $1}')
          echo "APK HTML size: $apk_size bytes"
          echo "APK HTML sha256: $apk_sha"
          test "$apk_size" -eq 154760
          test "$apk_sha" = "d17eb13033984cb5016ba76e37072b41632ed979a3f13469170f6e7a329881ea"

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: alghaidak-build-diagnostics
          path: |
            dist/build-status.txt
            dist/build.log
          retention-days: 14

      - name: Upload APK
        if: hashFiles('dist/alghaidak-huroofi-test.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: alghaidak-test-apk-fixed
          path: dist/alghaidak-huroofi-test.apk
          retention-days: 14

      - name: Commit build result
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/build-status.txt dist/build.log
          if [ -f dist/alghaidak-huroofi-test.apk ]; then git add -f dist/alghaidak-huroofi-test.apk; fi
          git commit -m "APK build result [skip ci]" || true
          git push

      - name: Publish test release
        if: github.event_name == 'push' && hashFiles('dist/alghaidak-huroofi-test.apk') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-v0.2 --cleanup-tag -y || true
          gh release create test-v0.2 dist/alghaidak-huroofi-test.apk \
            --title "حروفي - الغيدق | نسخة اختبار مصححة" \
            --notes "إصلاح الشاشة البيضاء والتحقق من تضمين ملف التطبيق الكامل داخل APK." \
            --prerelease

      - name: Fail workflow if APK build failed
        run: |
          if [ "$(cat dist/build-status.txt)" != "0" ]; then
            echo "APK build failed. See diagnostics artifact."
            exit 1
          fi
