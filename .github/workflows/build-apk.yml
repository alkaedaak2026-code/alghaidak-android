name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore app HTML
        run: |
          mkdir -p app/src/main/assets
          cat app/src/main/assets_parts/part01.txt \
              app/src/main/assets_parts/part02.txt \
              app/src/main/assets_parts/part03.txt \
              app/src/main/assets_parts/part04.txt \
              app/src/main/assets_parts/part05.txt > /tmp/index.html.gz.b64
          base64 -d /tmp/index.html.gz.b64 | gunzip > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          echo "HTML size: $(wc -c < app/src/main/assets/index.html) bytes"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/alghaidak-huroofi-test.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: alghaidak-test-apk
          path: dist/alghaidak-huroofi-test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/alghaidak-huroofi-test.apk
          git commit -m "Build test APK [skip ci]" || true
          git push

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-v0.1 --cleanup-tag -y || true
          gh release create test-v0.1 dist/alghaidak-huroofi-test.apk \
            --title "حروفي - الغيدق | نسخة اختبار" \
            --notes "نسخة APK تجريبية لاختبار التطبيق على الجوال وتصحيح الملاحظات قبل الإصدار النهائي." \
            --prerelease
