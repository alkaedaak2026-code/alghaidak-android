name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore app HTML
        run: |
          mkdir -p app/src/main/assets dist
          cat app/src/main/assets_parts/part01.txt \
              app/src/main/assets_parts/part02.txt \
              app/src/main/assets_parts/part03.txt \
              app/src/main/assets_parts/part04.txt \
              app/src/main/assets_parts/part05.txt > /tmp/index.html.gz.b64
          base64 -d /tmp/index.html.gz.b64 | gunzip > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          echo "HTML size: $(wc -c < app/src/main/assets/index.html) bytes"

      - name: Build debug APK and save diagnostics
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug 2>&1 | tee dist/build.log
          status=${PIPESTATUS[0]}
          echo "$status" > dist/build-status.txt
          if [ "$status" -eq 0 ] && [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/alghaidak-huroofi-test.apk
          fi
          exit 0

      - name: Commit build result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/build-status.txt dist/build.log
          if [ -f dist/alghaidak-huroofi-test.apk ]; then git add -f dist/alghaidak-huroofi-test.apk; fi
          git commit -m "APK build result [skip ci]" || true
          git push

      - name: Upload workflow artifact
        if: hashFiles('dist/alghaidak-huroofi-test.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: alghaidak-test-apk
          path: dist/alghaidak-huroofi-test.apk
          retention-days: 14

      - name: Publish test release
        if: hashFiles('dist/alghaidak-huroofi-test.apk') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-v0.1 --cleanup-tag -y || true
          gh release create test-v0.1 dist/alghaidak-huroofi-test.apk \
            --title "حروفي - الغيدق | نسخة اختبار" \
            --notes "نسخة APK تجريبية لاختبار التطبيق على الجوال وتصحيح الملاحظات قبل الإصدار النهائي." \
            --prerelease

      - name: Fail workflow if APK build failed
        run: |
          if [ "$(cat dist/build-status.txt)" != "0" ]; then
            echo "APK build failed. See dist/build.log"
            exit 1
          fi
